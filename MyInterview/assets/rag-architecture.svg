<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ra" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#4b5563"/>
    </marker>
    <marker id="rp" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#6b3fa0"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18.5" font-weight="700" fill="#1f2937">AI / LLM Reference Architecture — retrieval · grounding · orchestration · evaluation</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#6b7280">The framework first, then the first implementation on it: the RAG support assistant</text>

  <!-- INDEX TIME -->
  <rect x="24" y="68" width="952" height="132" rx="10" fill="#f0f7ff" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="40" y="88" font-size="12" font-weight="700" fill="#0078D4">1 · INDEX TIME (offline, incremental — unchanged documents are never re-embedded)</text>

  <rect x="44" y="100" width="176" height="84" rx="7" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="132" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Sources</text>
  <text x="58" y="142" font-size="10.5" fill="#4b5563">• support email threads</text>
  <text x="58" y="159" font-size="10.5" fill="#4b5563">• Confluence runbooks</text>
  <text x="58" y="176" font-size="10.5" fill="#4b5563">• past response history</text>

  <rect x="248" y="100" width="176" height="84" rx="7" fill="#deecf9" stroke="#0078D4" stroke-width="1.5"/>
  <text x="336" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Chunk</text>
  <text x="262" y="142" font-size="10.5" fill="#4b5563">Structure-aware split.</text>
  <text x="262" y="159" font-size="10.5" fill="#4b5563">A runbook step cut in</text>
  <text x="262" y="176" font-size="10.5" fill="#4b5563">half retrieves badly.</text>

  <rect x="452" y="100" width="176" height="84" rx="7" fill="#f3eefd" stroke="#6b3fa0" stroke-width="1.5"/>
  <text x="540" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Embed</text>
  <text x="466" y="142" font-size="10.5" fill="#4b5563">Cached — re-embedding</text>
  <text x="466" y="159" font-size="10.5" fill="#4b5563">unchanged content is</text>
  <text x="466" y="176" font-size="10.5" fill="#4b5563">pure cost, no benefit.</text>

  <rect x="656" y="100" width="300" height="84" rx="7" fill="#eaf6ec" stroke="#107C10" stroke-width="2"/>
  <text x="806" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Vector store (Chroma DB)</text>
  <text x="670" y="142" font-size="10.5" fill="#4b5563">vector + metadata: source · date ·</text>
  <text x="670" y="159" font-size="10.5" font-weight="700" fill="#107C10">the permissions of the source document</text>
  <text x="670" y="176" font-size="10" fill="#6b7280">This metadata is what stops cross-user data leakage.</text>

  <line x1="220" y1="142" x2="244" y2="142" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ra)"/>
  <line x1="424" y1="142" x2="448" y2="142" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ra)"/>
  <line x1="628" y1="142" x2="652" y2="142" stroke="#4b5563" stroke-width="1.8" marker-end="url(#ra)"/>

  <!-- QUERY TIME -->
  <rect x="24" y="214" width="952" height="230" rx="10" fill="#fbf7ff" stroke="#6b3fa0" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="40" y="234" font-size="12" font-weight="700" fill="#6b3fa0">2 · QUERY TIME — orchestrated as a small state machine (LangGraph), not one model call</text>

  <rect x="44" y="248" width="150" height="70" rx="7" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="119" y="272" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Support engineer</text>
  <text x="119" y="292" text-anchor="middle" font-size="10.5" fill="#6b7280">asks a question</text>
  <text x="119" y="308" text-anchor="middle" font-size="10.5" fill="#6b7280">signed in via Entra ID</text>

  <rect x="222" y="248" width="150" height="70" rx="7" fill="#deecf9" stroke="#0078D4" stroke-width="1.5"/>
  <text x="297" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Classify + embed</text>
  <text x="297" y="290" text-anchor="middle" font-size="10.5" fill="#4b5563">small cheap model</text>
  <text x="297" y="306" text-anchor="middle" font-size="10.5" fill="#4b5563">routes the question</text>

  <rect x="400" y="248" width="176" height="70" rx="7" fill="#eaf6ec" stroke="#107C10" stroke-width="2"/>
  <text x="488" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Hybrid retrieve</text>
  <text x="488" y="287" text-anchor="middle" font-size="10.5" fill="#4b5563">keyword + vector</text>
  <text x="488" y="304" text-anchor="middle" font-size="10.5" font-weight="700" fill="#107C10">filtered by caller's rights</text>

  <rect x="604" y="248" width="160" height="70" rx="7" fill="#fff9e6" stroke="#B7791F" stroke-width="1.5"/>
  <text x="684" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Sufficient?</text>
  <text x="684" y="288" text-anchor="middle" font-size="10.5" fill="#4b5563">weak context →</text>
  <text x="684" y="305" text-anchor="middle" font-size="10.5" fill="#4b5563">rewrite &amp; retry, or refuse</text>

  <rect x="792" y="248" width="164" height="70" rx="7" fill="#f3eefd" stroke="#6b3fa0" stroke-width="2"/>
  <text x="874" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Generate</text>
  <text x="874" y="288" text-anchor="middle" font-size="10.5" fill="#4b5563">grounded answer</text>
  <text x="874" y="305" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b3fa0">with citations</text>

  <line x1="194" y1="283" x2="218" y2="283" stroke="#6b3fa0" stroke-width="1.8" marker-end="url(#rp)"/>
  <line x1="372" y1="283" x2="396" y2="283" stroke="#6b3fa0" stroke-width="1.8" marker-end="url(#rp)"/>
  <line x1="576" y1="283" x2="600" y2="283" stroke="#6b3fa0" stroke-width="1.8" marker-end="url(#rp)"/>
  <line x1="764" y1="283" x2="788" y2="283" stroke="#6b3fa0" stroke-width="1.8" marker-end="url(#rp)"/>
  <!-- retrieval feed -->
  <path d="M806 184 L806 210 L488 210 L488 244" fill="none" stroke="#107C10" stroke-width="1.8" marker-end="url(#ra)"/>
  <!-- rewrite loop -->
  <path d="M684 318 L684 340 L488 340 L488 320" fill="none" stroke="#B7791F" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ra)"/>
  <text x="586" y="356" text-anchor="middle" font-size="10" fill="#B7791F" font-weight="600">rewrite query and retrieve again (bounded retries)</text>

  <!-- grounding rules -->
  <rect x="44" y="366" width="440" height="62" rx="7" fill="#fdeaea" stroke="#D13438" stroke-width="1.8"/>
  <text x="58" y="386" font-size="11.5" font-weight="700" fill="#D13438">GROUNDING RULES (non-negotiable)</text>
  <text x="58" y="404" font-size="10.5" fill="#374151">Answer only from retrieved context · always cite the source ·</text>
  <text x="58" y="420" font-size="10.5" fill="#374151">weak retrieval → say "I do not know" and show the escalation path.</text>

  <rect x="500" y="366" width="456" height="62" rx="7" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="514" y="386" font-size="11.5" font-weight="700" fill="#1f2937">A confident answer with no citation is a DEFECT, not a quirk.</text>
  <text x="514" y="404" font-size="10.5" fill="#4b5563">Scope is also a control: this assistant answers support and process questions —</text>
  <text x="514" y="420" font-size="10.5" fill="#4b5563">it does not answer investment questions.</text>

  <!-- EVALUATION -->
  <rect x="24" y="458" width="952" height="132" rx="10" fill="#f0fdf4" stroke="#107C10" stroke-width="2"/>
  <text x="40" y="478" font-size="12" font-weight="700" fill="#107C10">3 · EVALUATION — the part teams skip, and the reason their assistant quietly rots</text>

  <rect x="44" y="490" width="216" height="84" rx="7" fill="#ffffff" stroke="#107C10" stroke-width="1.5"/>
  <text x="152" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Gold question set</text>
  <text x="58" y="532" font-size="10.5" fill="#4b5563">~100–200 real questions with</text>
  <text x="58" y="549" font-size="10.5" fill="#4b5563">known answers and known</text>
  <text x="58" y="566" font-size="10.5" fill="#4b5563">source documents.</text>

  <rect x="284" y="490" width="300" height="84" rx="7" fill="#ffffff" stroke="#107C10" stroke-width="1.5"/>
  <text x="434" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Three scores, measured separately</text>
  <text x="298" y="532" font-size="10.5" fill="#4b5563"><tspan font-weight="700">Retrieval recall</tspan> — did we fetch the right docs?</text>
  <text x="298" y="549" font-size="10.5" fill="#4b5563"><tspan font-weight="700">Groundedness</tspan> — is every claim supported?</text>
  <text x="298" y="566" font-size="10.5" fill="#4b5563"><tspan font-weight="700">Correctness</tspan> — does it match the expected answer?</text>

  <rect x="608" y="490" width="348" height="84" rx="7" fill="#ffffff" stroke="#107C10" stroke-width="1.5"/>
  <text x="782" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">CI gate + live telemetry (LangSmith)</text>
  <text x="622" y="532" font-size="10.5" fill="#4b5563">A regression beyond tolerance blocks the release.</text>
  <text x="622" y="549" font-size="10.5" fill="#4b5563">Every live answer logs: question · retrieved doc ids ·</text>
  <text x="622" y="566" font-size="10.5" fill="#4b5563">model · tokens · latency · user's useful/not-useful.</text>

  <!-- footer -->
  <rect x="24" y="604" width="952" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="622" font-size="11.5" font-weight="700" fill="#1f2937">Why separate retrieval score from answer score:</text>
  <text x="336" y="622" font-size="11.5" fill="#374151">if the right runbook was never retrieved, no prompt change can rescue the answer.</text>
  <text x="40" y="639" font-size="11.5" fill="#374151">Splitting the two scores tells me which half to fix — and stops weeks of pointless prompt tuning.</text>
</svg>
