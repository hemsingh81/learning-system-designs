<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ha" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="980" height="580" fill="#ffffff"/>
  <text x="490" y="28" text-anchor="middle" font-size="18.5" font-weight="700" fill="#1f2937">Tiered HA / DR — each component gets the tier its RTO and RPO justify</text>
  <text x="490" y="50" text-anchor="middle" font-size="12" fill="#6b7280">Paying one uniform high tier for everything is where the money goes</text>

  <!-- front door -->
  <rect x="360" y="68" width="260" height="46" rx="8" fill="#deecf9" stroke="#0078D4" stroke-width="2"/>
  <text x="490" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">Azure Front Door</text>
  <text x="490" y="105" text-anchor="middle" font-size="10.5" fill="#6b7280">health probes · failover is a routing decision</text>

  <line x1="420" y1="114" x2="270" y2="146" stroke="#107C10" stroke-width="2" marker-end="url(#ha)"/>
  <line x1="560" y1="114" x2="710" y2="146" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ha)"/>
  <text x="318" y="132" font-size="10.5" font-weight="700" fill="#107C10">active</text>
  <text x="640" y="132" font-size="10.5" font-weight="700" fill="#6b7280">passive (standby)</text>

  <!-- PRIMARY -->
  <rect x="30" y="150" width="440" height="256" rx="10" fill="#f0fdf4" stroke="#107C10" stroke-width="2"/>
  <text x="46" y="172" font-size="12.5" font-weight="700" fill="#107C10">PRIMARY REGION — zone redundant</text>

  <rect x="48" y="186" width="404" height="62" rx="7" fill="#ffffff" stroke="#0078D4" stroke-width="1.5"/>
  <text x="62" y="206" font-size="12" font-weight="700" fill="#1f2937">Reporting API (stateless) — App Service, multi-instance across zones</text>
  <text x="62" y="225" font-size="10.5" fill="#4b5563">RTO: minutes · RPO: n/a (holds no state)</text>
  <text x="62" y="241" font-size="10.5" fill="#107C10" font-weight="600">Stateless is what makes failover cheap — there is nothing to recover.</text>

  <rect x="48" y="258" width="404" height="62" rx="7" fill="#ffffff" stroke="#107C10" stroke-width="1.5"/>
  <text x="62" y="278" font-size="12" font-weight="700" fill="#1f2937">Operational database — Azure SQL, zone redundant</text>
  <text x="62" y="297" font-size="10.5" fill="#4b5563">RTO: under an hour · RPO: minutes</text>
  <text x="62" y="313" font-size="10.5" fill="#4b5563">Geo-replica + point-in-time restore. This is the expensive tier — and it earns it.</text>

  <rect x="48" y="330" width="404" height="62" rx="7" fill="#ffffff" stroke="#B7791F" stroke-width="1.5"/>
  <text x="62" y="350" font-size="12" font-weight="700" fill="#1f2937">Ingestion pipeline — checkpointed and idempotent</text>
  <text x="62" y="369" font-size="10.5" fill="#4b5563">RTO: hours · RPO: near zero</text>
  <text x="62" y="385" font-size="10.5" fill="#B7791F" font-weight="600">Recovery tool #1 is REPLAY from source, not restore from backup.</text>

  <!-- SECONDARY -->
  <rect x="510" y="150" width="440" height="256" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="526" y="172" font-size="12.5" font-weight="700" fill="#6b7280">SECONDARY REGION — passive</text>

  <rect x="528" y="186" width="404" height="62" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="542" y="206" font-size="12" font-weight="700" fill="#374151">Reporting API — deployed, minimal capacity</text>
  <text x="542" y="225" font-size="10.5" fill="#6b7280">Same artifact, same IaC template, scaled down.</text>
  <text x="542" y="241" font-size="10.5" fill="#6b7280">Scaled up on failover, not kept warm at full size.</text>

  <rect x="528" y="258" width="404" height="62" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="542" y="278" font-size="12" font-weight="700" fill="#374151">Geo-replica of the operational database</text>
  <text x="542" y="297" font-size="10.5" fill="#6b7280">Read-only until promoted.</text>
  <text x="542" y="313" font-size="10.5" fill="#6b7280">Promotion is a documented, timed step in the runbook.</text>

  <rect x="528" y="330" width="404" height="62" rx="7" fill="#fffbe6" stroke="#B7791F" stroke-width="1.5"/>
  <text x="542" y="350" font-size="12" font-weight="700" fill="#374151">Analytical store — NOT replicated</text>
  <text x="542" y="369" font-size="10.5" fill="#4b5563">It is derived data. Its DR plan is "run the pipeline".</text>
  <text x="542" y="385" font-size="10.5" fill="#B7791F" font-weight="600">This row is the money-saver — and it is an architecture decision, not a cost trick.</text>

  <!-- active-passive note -->
  <rect x="30" y="422" width="460" height="76" rx="8" fill="#fbf7ff" stroke="#6b3fa0" stroke-width="1.8"/>
  <text x="46" y="444" font-size="12" font-weight="700" fill="#6b3fa0">Why active-passive, not active-active</text>
  <text x="46" y="464" font-size="11" fill="#374151">Active-active on a financial data store means solving write conflicts.</text>
  <text x="46" y="482" font-size="11" fill="#374151">The business did not value the extra nines enough to pay that cost. Naming that trade-off IS the answer.</text>

  <rect x="510" y="422" width="440" height="76" rx="8" fill="#fdeaea" stroke="#D13438" stroke-width="1.8"/>
  <text x="526" y="444" font-size="12" font-weight="700" fill="#D13438">A DR plan that is never tested does not exist</text>
  <text x="526" y="464" font-size="11" fill="#374151">First real drill on a client platform: documented RTO two hours,</text>
  <text x="526" y="482" font-size="11" fill="#374151">actual much longer — nobody had written down the DNS steps. Fix the runbook, not the architecture.</text>

  <!-- deliverable -->
  <rect x="30" y="512" width="920" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="532" font-size="12" font-weight="700" fill="#1f2937">What I actually hand the business as "disaster recovery":</text>
  <text x="46" y="552" font-size="11.5" fill="#374151">a runbook with named owners · a tested and TIMED failover · a scheduled re-test · and a failback procedure (failback is harder than failover and gets less attention).</text>
</svg>
