<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="pa" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#0078D4"/>
    </marker>
    <marker id="pd" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#D13438"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="28" text-anchor="middle" font-size="18.5" font-weight="700" fill="#1f2937">Pre-Sales to Delivery — the architect carries the promise all the way through</text>

  <!-- stages -->
  <g>
    <rect x="24" y="56" width="128" height="104" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="2"/>
    <text x="88" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">1 · Qualify</text>
    <text x="36" y="102" font-size="10" fill="#4b5563">Should we bid at all?</text>
    <text x="36" y="118" font-size="10" fill="#4b5563">Domain · non-negotiables</text>
    <text x="36" y="134" font-size="10" fill="#4b5563">Incumbent · real timeline</text>
    <text x="36" y="152" font-size="9.5" font-weight="700" fill="#D13438">A "no bid" is a valid win</text>

    <rect x="168" y="56" width="128" height="104" rx="8" fill="#deecf9" stroke="#0078D4" stroke-width="2"/>
    <text x="232" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">2 · Solution</text>
    <text x="180" y="102" font-size="10" fill="#4b5563">ONE-page architecture</text>
    <text x="180" y="118" font-size="10" fill="#4b5563">Decisions + rejected</text>
    <text x="180" y="134" font-size="10" fill="#4b5563">alternatives</text>
    <text x="180" y="152" font-size="9.5" font-weight="700" fill="#0078D4">Every claim specific</text>

    <rect x="312" y="56" width="128" height="104" rx="8" fill="#eaf6ec" stroke="#107C10" stroke-width="2"/>
    <text x="376" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">3 · Estimate</text>
    <text x="324" y="102" font-size="10" fill="#4b5563">Decompose to work</text>
    <text x="324" y="118" font-size="10" fill="#4b5563">I have actually done</text>
    <text x="324" y="134" font-size="10" fill="#4b5563">3-point + named contingency</text>
    <text x="324" y="152" font-size="9.5" font-weight="700" fill="#107C10">Assumptions in the number</text>

    <rect x="456" y="56" width="128" height="104" rx="8" fill="#fff9e6" stroke="#B7791F" stroke-width="2"/>
    <text x="520" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">4 · Win themes</text>
    <text x="468" y="102" font-size="10" fill="#4b5563">What do they FEAR?</text>
    <text x="468" y="118" font-size="10" fill="#4b5563">Who decides, and why</text>
    <text x="468" y="134" font-size="10" fill="#4b5563">Own our weakness first</text>
    <text x="468" y="152" font-size="9.5" font-weight="700" fill="#B7791F">3 themes, every section</text>

    <rect x="600" y="56" width="128" height="104" rx="8" fill="#f3eefd" stroke="#6b3fa0" stroke-width="2"/>
    <text x="664" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">5 · Respond</text>
    <text x="612" y="102" font-size="10" fill="#4b5563">Write to the evaluator</text>
    <text x="612" y="118" font-size="10" fill="#4b5563">Their structure, their words</text>
    <text x="612" y="134" font-size="10" fill="#4b5563">Compliance matrix all TRUE</text>
    <text x="612" y="152" font-size="9.5" font-weight="700" fill="#6b3fa0">Easy to score wins</text>

    <rect x="744" y="56" width="128" height="104" rx="8" fill="#fdf1e7" stroke="#C05621" stroke-width="2"/>
    <text x="808" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">6 · Defend</text>
    <text x="756" y="102" font-size="10" fill="#4b5563">Open with THEIR problem</text>
    <text x="756" y="118" font-size="10" fill="#4b5563">One diagram, known cold</text>
    <text x="756" y="134" font-size="10" fill="#4b5563">"I don't know" + a date</text>
    <text x="756" y="152" font-size="9.5" font-weight="700" fill="#C05621">Name the risk yourself</text>

    <rect x="884" y="56" width="72" height="104" rx="8" fill="#eaf6ec" stroke="#107C10" stroke-width="2.5"/>
    <text x="920" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#107C10">7</text>
    <text x="920" y="106" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">Deliver</text>
    <text x="920" y="128" text-anchor="middle" font-size="9.5" fill="#4b5563">the same</text>
    <text x="920" y="142" text-anchor="middle" font-size="9.5" fill="#4b5563">architect</text>
  </g>

  <g stroke="#0078D4" stroke-width="2">
    <line x1="152" y1="108" x2="164" y2="108" marker-end="url(#pa)"/>
    <line x1="296" y1="108" x2="308" y2="108" marker-end="url(#pa)"/>
    <line x1="440" y1="108" x2="452" y2="108" marker-end="url(#pa)"/>
    <line x1="584" y1="108" x2="596" y2="108" marker-end="url(#pa)"/>
    <line x1="728" y1="108" x2="740" y2="108" marker-end="url(#pa)"/>
    <line x1="872" y1="108" x2="880" y2="108" marker-end="url(#pa)"/>
  </g>

  <!-- the accountability loop -->
  <path d="M920 160 L920 210 L232 210 L232 176" fill="none" stroke="#D13438" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#pd)"/>
  <rect x="330" y="188" width="330" height="24" rx="4" fill="#ffffff"/>
  <text x="495" y="205" text-anchor="middle" font-size="11.5" font-weight="700" fill="#D13438">The promise made here is the promise someone runs at 3 a.m.</text>

  <!-- who owns what -->
  <rect x="24" y="238" width="932" height="118" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="260" font-size="13" font-weight="700" fill="#1f2937">Who owns what in a pursuit</text>

  <rect x="40" y="272" width="290" height="70" rx="6" fill="#deecf9" stroke="#0078D4" stroke-width="1.5"/>
  <text x="54" y="292" font-size="11.5" font-weight="700" fill="#0078D4">SOLUTION ARCHITECT (me)</text>
  <text x="54" y="310" font-size="10.5" fill="#374151">Solution · estimate · technical narrative ·</text>
  <text x="54" y="326" font-size="10.5" fill="#374151">credibility with their technical people</text>

  <rect x="344" y="272" width="290" height="70" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="358" y="292" font-size="11.5" font-weight="700" fill="#374151">SALES / COMMERCIAL</text>
  <text x="358" y="310" font-size="10.5" fill="#374151">Relationship · pursuit strategy · price</text>
  <text x="358" y="326" font-size="10.5" fill="#374151">I never quote price or date unagreed</text>

  <rect x="648" y="272" width="292" height="70" rx="6" fill="#fdeaea" stroke="#D13438" stroke-width="1.5"/>
  <text x="662" y="292" font-size="11.5" font-weight="700" fill="#D13438">LEGAL — where I MUST be involved</text>
  <text x="662" y="310" font-size="10.5" fill="#374151">SLA numbers · data residency · IP ·</text>
  <text x="662" y="326" font-size="10.5" fill="#374151">liability tied to availability</text>

  <!-- bottom rule -->
  <rect x="24" y="372" width="932" height="60" rx="9" fill="#fdeaea" stroke="#D13438" stroke-width="2"/>
  <text x="40" y="396" font-size="13" font-weight="700" fill="#D13438">The rule I never break</text>
  <text x="40" y="418" font-size="12.5" fill="#1f2937">I never let a commitment be signed that I have not read. Legal cannot know whether the architecture supports a four-hour recovery promise. I can — so it is mine.</text>

  <rect x="24" y="448" width="932" height="56" rx="9" fill="#f0fdf4" stroke="#107C10" stroke-width="2"/>
  <text x="40" y="470" font-size="13" font-weight="700" fill="#107C10">Why I stay through delivery</text>
  <text x="40" y="492" font-size="12.5" fill="#1f2937">It is the strongest estimating discipline there is: whatever I promise in the proposal, I am the one who has to run it in production.</text>
</svg>
