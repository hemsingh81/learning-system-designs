[project]
name = "aisets"
version = "0.1.0"
description = "A hands-on tutorial: AI Skills -> AI Workflow -> AI Agent -> Agentic AI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real Anthropic API, needs ANTHROPIC_API_KEY, skipped by default",
]
addopts = "-m 'not live'"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
