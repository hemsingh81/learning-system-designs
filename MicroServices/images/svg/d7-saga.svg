<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Carlito, 'DejaVu Sans', sans-serif">
  <defs>
    <style>
      .bg    { fill:#0F1620; }
      .panel { fill:#141D28; stroke:#2A3947; stroke-width:1.5; }
      .h1    { fill:#E8EEF4; font-size:30px; font-weight:700; letter-spacing:-0.4px; }
      .sub   { fill:#8FA3B5; font-size:15px; }
      .pt    { fill:#3DDC97; font-size:20px; font-weight:700; letter-spacing:1.6px; }
      .pd    { fill:#8FA3B5; font-size:13.5px; }
      .node  { fill:#0F241C; stroke:#3DDC97; stroke-width:1.6; }
      .orch  { fill:#0F241C; stroke:#3DDC97; stroke-width:2.2; }
      .name  { fill:#E8EEF4; font-size:16px; font-weight:600;
               font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
      .msg   { fill:#3DDC97; font-size:12.5px;
               font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
      .msgr  { fill:#F45B69; font-size:12.5px;
               font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
      .state { fill:#A8BACB; font-size:12.5px;
               font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
      .mid   { fill:#7E93A6; font-size:13.5px; font-style:italic; }
      .wire  { stroke:#3DDC97; stroke-width:2.2; fill:none; }
      .wired { stroke:#3DDC97; stroke-width:1.6; fill:none; stroke-dasharray:5 5; opacity:0.75; }
      .wirer { stroke:#F45B69; stroke-width:2.2; fill:none; stroke-dasharray:7 5; }
      .wireg { stroke:#3A4A5C; stroke-width:1.6; fill:none; stroke-dasharray:5 5; }
      .ring  { fill:none; stroke:#3DDC97; stroke-width:1.4; stroke-dasharray:6 8; opacity:0.3; }
      .verd  { fill:#A8BACB; font-size:14px; }
      .foot  { fill:#5C6E80; font-size:13px; }
    </style>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3DDC97"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F45B69"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4A5C"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="h1"  x="60" y="72">Two ways to run a transaction across services</text>
  <text class="sub" x="60" y="102">Same transport, same events, same colours — the difference is structural. One has a centre. One doesn't.</text>

  <!-- ================= LEFT : CHOREOGRAPHY ================= -->
  <rect class="panel" x="60" y="150" width="710" height="680" rx="14"/>
  <text class="pt" x="84" y="202">CHOREOGRAPHY</text>
  <text class="pd" x="84" y="230">Each service reacts to the previous one's event. Nothing is in charge.</text>

  <ellipse class="ring" cx="415" cy="490" rx="185" ry="170"/>

  <rect class="node" x="335" y="291" width="160" height="58" rx="10"/>
  <text class="name" x="415" y="326" text-anchor="middle">Ordering</text>

  <rect class="node" x="520" y="461" width="160" height="58" rx="10"/>
  <text class="name" x="600" y="496" text-anchor="middle">Inventory</text>

  <rect class="node" x="335" y="631" width="160" height="58" rx="10"/>
  <text class="name" x="415" y="666" text-anchor="middle">Payments</text>

  <rect class="node" x="150" y="461" width="160" height="58" rx="10"/>
  <text class="name" x="230" y="496" text-anchor="middle">Shipping</text>

  <path class="wire" marker-end="url(#g)" d="M446.6 349 L 568.4 461"/>
  <text class="msg" x="548" y="368" text-anchor="middle">OrderPlaced</text>

  <path class="wire" marker-end="url(#g)" d="M568.6 519 L 446.4 631"/>
  <text class="msg" x="552" y="614" text-anchor="middle">StockReserved</text>

  <path class="wire" marker-end="url(#g)" d="M383.5 631 L 261.5 519"/>
  <text class="msg" x="278" y="614" text-anchor="middle">PaymentSucceeded</text>

  <path class="wire" marker-end="url(#g)" d="M261.5 461 L 383.5 349"/>
  <text class="msg" x="282" y="368" text-anchor="middle">OrderShipped</text>

  <text class="mid" x="415" y="478" text-anchor="middle">no one owns this flow</text>
  <text class="mid" x="415" y="502" text-anchor="middle">the ring only exists in your head</text>

  <line x1="84" y1="726" x2="746" y2="726" stroke="#2A3947"/>
  <text class="verd"  x="84" y="756">Fine with three services. Opaque with ten.</text>
  <text class="msgr"  x="84" y="784">Now picture the failure path.</text>
  <text class="verd"  x="84" y="808">It runs backwards through this ring — and exists in no single readable place.</text>

  <!-- ================= RIGHT : ORCHESTRATION ================= -->
  <rect class="panel" x="830" y="150" width="710" height="680" rx="14"/>
  <text class="pt" x="854" y="202">ORCHESTRATION</text>
  <text class="pd" x="854" y="230">One coordinator issues commands and owns the outcome.</text>

  <rect class="orch" x="854" y="330" width="230" height="300" rx="12"/>
  <text class="name"  x="969" y="378" text-anchor="middle" style="font-size:20px">OrderSaga</text>
  <text class="pd"    x="969" y="400" text-anchor="middle" style="font-size:11.5px">one class · one state machine</text>
  <line x1="874" y1="418" x2="1064" y2="418" stroke="#2A3947"/>
  <text class="state" x="878" y="448">▸ Pending</text>
  <text class="state" x="878" y="474">▸ StockReserved</text>
  <text class="msgr"  x="878" y="500">▸ PaymentFailed</text>
  <text class="msgr"  x="878" y="526">▸ Compensating</text>
  <text class="state" x="878" y="552">▸ Cancelled</text>
  <line x1="874" y1="574" x2="1064" y2="574" stroke="#2A3947"/>
  <text class="pd"    x="969" y="600" text-anchor="middle" style="font-size:11.5px">the whole flow, in one file</text>

  <rect class="node" x="1290" y="310" width="200" height="64" rx="10"/>
  <text class="name" x="1390" y="348" text-anchor="middle">Inventory</text>
  <path class="wire"  marker-start="url(#g)" marker-end="url(#g)" d="M1088 342 L 1286 342"/>
  <text class="msg"   x="1187" y="330" text-anchor="middle">1 · ReserveStock</text>
  <text class="msg"   x="1187" y="362" text-anchor="middle" opacity="0.75">↩ StockReserved</text>

  <rect class="node" x="1290" y="440" width="200" height="64" rx="10"/>
  <text class="name" x="1390" y="478" text-anchor="middle">Payments</text>
  <path class="wire"  marker-start="url(#g)" marker-end="url(#g)" d="M1088 472 L 1286 472"/>
  <text class="msg"   x="1187" y="460" text-anchor="middle">2 · ChargePayment</text>
  <text class="msgr"  x="1187" y="492" text-anchor="middle">↩ PaymentFailed</text>

  <rect x="1290" y="570" width="200" height="64" rx="10" fill="#161F2A" stroke="#3A4A5C" stroke-width="1.4" stroke-dasharray="5 5"/>
  <text class="name" x="1390" y="608" text-anchor="middle" fill="#5C6E80">Shipping</text>
  <path class="wireg" marker-end="url(#s)" d="M1088 602 L 1286 602"/>
  <text class="pd"    x="1187" y="590" text-anchor="middle" style="font-size:12px">3 · never reached</text>

  <path class="wirer" marker-end="url(#r)"
        d="M969 634 L 969 700 Q 969 722 991 722 L 1494 722 Q 1516 722 1516 700 L 1516 364 Q 1516 342 1494 342"/>
  <text class="msgr" x="1150" y="712" text-anchor="middle">4 · compensate backwards — ReleaseStock, then Cancel</text>

  <line x1="854" y1="756" x2="1516" y2="756" stroke="#2A3947"/>
  <text class="verd" x="854" y="786">One place to look. One thing to unit-test.</text>
  <text class="verd" x="854" y="810">The cost: the coordinator is now something that can itself fail.</text>

  <text class="foot" x="800" y="878" text-anchor="middle">You cannot roll back a distributed transaction. You can only apologise correctly — refund, restock, cancel.</text>
</svg>
