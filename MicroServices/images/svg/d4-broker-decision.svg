<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Carlito, 'DejaVu Sans', sans-serif">
  <defs>
    <style>
      .bg   { fill:#0F1620; }
      .h1   { fill:#E8EEF4; font-size:30px; font-weight:700; letter-spacing:-0.4px; }
      .sub  { fill:#8FA3B5; font-size:15px; }
      .qcard{ fill:#141D28; stroke:#2A3947; stroke-width:1.5; }
      .card { fill:#18222E; stroke:#2A3947; stroke-width:1.5; }
      .eye  { fill:#5C6E80; font-size:11px; font-weight:700; letter-spacing:2.2px; }
      .q    { fill:#C4D2DE; font-size:15px; font-weight:500; }
      .nm   { font-size:27px; font-weight:700; letter-spacing:-0.3px;
              font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
      .mm   { fill:#8FA3B5; font-size:14px; font-style:italic; }
      .bul  { fill:#A8BACB; font-size:13.5px; }
      .chip { font-size:10.5px; font-weight:700; letter-spacing:1px; }
      .case { fill:#6E8296; font-size:12px;
              font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
      .foot { fill:#5C6E80; font-size:12.5px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="h1"  x="60" y="72">Pick the broker your problem asks for</text>
  <text class="sub" x="60" y="102">Three questions decide it. Everything after that is taste, budget, or habit.</text>

  <!-- question spine -->
  <rect class="qcard" x="60"   y="140" width="480" height="100" rx="12"/>
  <text class="eye" x="84"  y="174">QUESTION 1</text>
  <text class="q"   x="84"  y="206">Does anyone need to re-read</text>
  <text class="q"   x="84"  y="228">old messages?</text>

  <rect class="qcard" x="580"  y="140" width="480" height="100" rx="12"/>
  <text class="eye" x="604" y="174">QUESTION 2</text>
  <text class="q"   x="604" y="206">Do you need per-message ack,</text>
  <text class="q"   x="604" y="228">retry and dead-lettering?</text>

  <rect class="qcard" x="1100" y="140" width="480" height="100" rx="12"/>
  <text class="eye" x="1124" y="174">QUESTION 3</text>
  <text class="q"   x="1124" y="206">Do you want to run the</text>
  <text class="q"   x="1124" y="228">broker yourself?</text>

  <!-- ============ RabbitMQ ============ -->
  <rect class="card" x="60" y="280" width="480" height="430" rx="14"/>
  <rect x="60" y="280" width="480" height="5" rx="2.5" fill="#FF7A45"/>
  <text class="nm" x="84" y="340" fill="#FF7A45">RabbitMQ</text>
  <text class="mm" x="84" y="368">Smart broker, dumb consumer</text>

  <rect x="84"  y="396" width="138" height="30" rx="15" fill="#5C6E80" fill-opacity="0.12" stroke="#3A4A5C"/>
  <text class="chip" x="153" y="416" text-anchor="middle" fill="#5C6E80">✗  REPLAY</text>
  <rect x="231" y="396" width="138" height="30" rx="15" fill="#FF7A45" fill-opacity="0.14" stroke="#FF7A45"/>
  <text class="chip" x="300" y="416" text-anchor="middle" fill="#FF7A45">✓  PER-MSG ACK</text>
  <rect x="378" y="396" width="138" height="30" rx="15" fill="#5C6E80" fill-opacity="0.12" stroke="#3A4A5C"/>
  <text class="chip" x="447" y="416" text-anchor="middle" fill="#5C6E80">✗  ZERO OPS</text>

  <text class="eye" x="84" y="470">SHINES WHEN</text>
  <text class="bul" x="84" y="498">•  Work is distributed across competing consumers</text>
  <text class="bul" x="84" y="522">•  You need retry, DLQ and priority per message</text>
  <text class="bul" x="84" y="546">•  Routing rules change more often than code does</text>

  <text class="eye" x="84" y="588">COSTS YOU</text>
  <text class="bul" x="84" y="616">•  No replay — once acked, the message is gone</text>
  <text class="bul" x="84" y="640">•  Routing logic lives in the broker, not in git</text>

  <line x1="84" y1="664" x2="516" y2="664" stroke="#2A3947"/>
  <text class="case" x="84" y="690">M3 · Order → Payment command flow</text>

  <!-- ============ Kafka ============ -->
  <rect class="card" x="580" y="280" width="480" height="430" rx="14"/>
  <rect x="580" y="280" width="480" height="5" rx="2.5" fill="#3DDC97"/>
  <text class="nm" x="604" y="340" fill="#3DDC97">Kafka</text>
  <text class="mm" x="604" y="368">Dumb broker, smart consumer</text>

  <rect x="604" y="396" width="138" height="30" rx="15" fill="#3DDC97" fill-opacity="0.14" stroke="#3DDC97"/>
  <text class="chip" x="673" y="416" text-anchor="middle" fill="#3DDC97">✓  REPLAY</text>
  <rect x="751" y="396" width="138" height="30" rx="15" fill="#5C6E80" fill-opacity="0.12" stroke="#3A4A5C"/>
  <text class="chip" x="820" y="416" text-anchor="middle" fill="#5C6E80">✗  PER-MSG ACK</text>
  <rect x="898" y="396" width="138" height="30" rx="15" fill="#5C6E80" fill-opacity="0.12" stroke="#3A4A5C"/>
  <text class="chip" x="967" y="416" text-anchor="middle" fill="#5C6E80">✗  ZERO OPS</text>

  <text class="eye" x="604" y="470">SHINES WHEN</text>
  <text class="bul" x="604" y="498">•  Many independent consumers read one stream</text>
  <text class="bul" x="604" y="522">•  You need to replay history to rebuild state</text>
  <text class="bul" x="604" y="546">•  Ordering per key, at very high throughput</text>

  <text class="eye" x="604" y="588">COSTS YOU</text>
  <text class="bul" x="604" y="616">•  Real ops weight — partitions, offsets, rebalancing</text>
  <text class="bul" x="604" y="640">•  One poison message can stall a whole partition</text>

  <line x1="604" y1="664" x2="1036" y2="664" stroke="#2A3947"/>
  <text class="case" x="604" y="690">M4 · stock movement log + analytics fan-out</text>

  <!-- ============ Azure Service Bus ============ -->
  <rect class="card" x="1100" y="280" width="480" height="430" rx="14"/>
  <rect x="1100" y="280" width="480" height="5" rx="2.5" fill="#6C8EF5"/>
  <text class="nm" x="1124" y="340" fill="#6C8EF5">Azure Service Bus</text>
  <text class="mm" x="1124" y="368">Managed enterprise messaging</text>

  <rect x="1124" y="396" width="138" height="30" rx="15" fill="#5C6E80" fill-opacity="0.12" stroke="#3A4A5C"/>
  <text class="chip" x="1193" y="416" text-anchor="middle" fill="#5C6E80">✗  REPLAY</text>
  <rect x="1271" y="396" width="138" height="30" rx="15" fill="#6C8EF5" fill-opacity="0.14" stroke="#6C8EF5"/>
  <text class="chip" x="1340" y="416" text-anchor="middle" fill="#6C8EF5">✓  PER-MSG ACK</text>
  <rect x="1418" y="396" width="138" height="30" rx="15" fill="#6C8EF5" fill-opacity="0.14" stroke="#6C8EF5"/>
  <text class="chip" x="1487" y="416" text-anchor="middle" fill="#6C8EF5">✓  ZERO OPS</text>

  <text class="eye" x="1124" y="470">SHINES WHEN</text>
  <text class="bul" x="1124" y="498">•  Strict FIFO via sessions, and scheduled delivery</text>
  <text class="bul" x="1124" y="522">•  Duplicate detection you don't have to write</text>
  <text class="bul" x="1124" y="546">•  Nobody on the team wants to run a broker</text>

  <text class="eye" x="1124" y="588">COSTS YOU</text>
  <text class="bul" x="1124" y="616">•  Cloud lock-in, and cost that scales with volume</text>
  <text class="bul" x="1124" y="640">•  A throughput ceiling well below Kafka's</text>

  <line x1="1124" y1="664" x2="1556" y2="664" stroke="#2A3947"/>
  <text class="case" x="1124" y="690">M5 · settlement batch, strict ordering</text>

  <!-- ============ Dapr strip ============ -->
  <rect class="card" x="60" y="740" width="1520" height="120" rx="14" stroke="#B980F0" stroke-opacity="0.55"/>
  <rect x="60" y="740" width="5" height="120" rx="2.5" fill="#B980F0"/>
  <text class="nm" x="92" y="784" fill="#B980F0" style="font-size:24px">Dapr</text>
  <text class="mm" x="192" y="784">— not a broker. A layer over any of the three above.</text>
  <text class="bul" x="92" y="814">Same pub/sub API in your code; swap RabbitMQ for Kafka for Service Bus by editing YAML, not C#.</text>
  <text class="bul" x="92" y="838" fill="#8FA3B5">Buys portability and ready-made building blocks. Costs sidecar overhead — and hides each broker's best features behind a lowest-common-denominator API.</text>
  <text class="case" x="1330" y="838">M6 · same flow, broker swapped</text>

  <text class="foot" x="60" y="886">This diagram uses tool-identity colours. Everywhere else in the set, colour means synchronous / asynchronous / edge.</text>
</svg>
