# E-commerce case study — infrastructure only.
#
# This file starts the things you would otherwise waste an afternoon installing:
# a broker, a database, and a trace viewer. Run your services against it.
#
#   docker compose up -d
#
# Then:
#   RabbitMQ UI   http://localhost:15672   (guest / guest)
#   Jaeger UI     http://localhost:16686
#   SQL Server    localhost:1433           (sa / Str0ng!Passw0rd)
#
# Point your services at:
#   ConnectionStrings__Default            Server=localhost,1433;Database=…;User Id=sa;Password=Str0ng!Passw0rd;TrustServerCertificate=true
#   RabbitMq__Host                        localhost
#   OTEL_EXPORTER_OTLP_ENDPOINT           http://localhost:4317

services:

  # ── The broker ────────────────────────────────────────────────────────────
  # RabbitMQ, not Kafka. Question 2 of the decision framework is a clear "no" —
  # nobody replays orders. See "Decision 5" in the README.
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ecom-rabbitmq
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI — watch queue depth here during the exercises
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbit-data:/var/lib/rabbitmq

  # ── Databases ─────────────────────────────────────────────────────────────
  # ONE container, but each service creates and owns its OWN database inside it.
  # Sharing a server is an operational convenience for local development.
  # Sharing a DATABASE would break chapter 6 — never do that, even locally,
  # because "just this once" is how shared tables are born.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecom-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      MSSQL_PID: Developer
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - sql-data:/var/opt/mssql

  # ── Observability ─────────────────────────────────────────────────────────
  # Running this LOCALLY is the point (chapter 10, edge 7). If a developer
  # cannot see a trace on day one, they will not maintain tracing later.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecom-jaeger
    ports:
      - "16686:16686"    # UI
      - "4317:4317"      # OTLP gRPC — services export here
      - "4318:4318"      # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ── A fake payment provider ───────────────────────────────────────────────
  # WireMock stands in for the external PSP, so you can make it slow, make it
  # fail, and make it time out — which is most of the "now break it" list.
  #
  # Put mappings in ./mocks/psp/mappings/*.json, for example a 4-second delay
  # on POST /v1/charges to reproduce the 2 a.m. incident from chapter 2.
  psp-mock:
    image: wiremock/wiremock:latest
    container_name: ecom-psp-mock
    ports:
      - "8089:8080"
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./mocks/psp:/home/wiremock

volumes:
  rabbit-data:
  sql-data:
