# Trading app case study — infrastructure only.
#
#   docker compose up -d
#
#   Redis        localhost:6379          ← risk state, kill switch, SignalR backplane
#   Kafka        localhost:9092          ← order and fill event log (audit)
#   RabbitMQ     localhost:5672          ← commands (order routing)
#   PostgreSQL   localhost:5432          ← orders, fills, positions
#   Jaeger       http://localhost:16686
#   Broker mock  http://localhost:8089
#
# THREE data stores, and each is here for a specific reason:
#
#   Redis        the risk hot path needs single-digit-millisecond reads. A
#                relational query cannot fit in an 8ms budget alongside
#                everything else.
#
#   Kafka        orders and fills are an audit trail. Regulators ask years
#                later, and positions are rebuilt from the fill stream.
#
#   RabbitMQ     commands need per-message ack and dead-lettering. "Route this
#                order" must be handled exactly once, and a failure must be
#                visible in a DLQ, not buried in a consumer offset.
#
# Using one tool for all three would compromise at least one of them. See
# chapter 4 — the mental models genuinely differ.

services:

  # ── Risk hot-path state ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trade-redis
    ports:
      - "6379:6379"
    command:
      - "redis-server"
      # No persistence to disk on this instance: it holds a CACHE, rebuildable
      # from events at startup. Disk writes would add latency for no benefit.
      # (Kill-switch state is also mirrored in Postgres, so a Redis restart
      # cannot silently re-enable trading.)
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "2gb"
      - "--maxmemory-policy"
      - "noeviction"       # NEVER evict risk state. Missing state = fail closed
                           # = every order rejected. Better to alert on memory.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ── The audit log ─────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: trade-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Orders and fills are kept forever — positions are rebuilt from them.
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ── Commands ──────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4-management
    container_name: trade-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
    volumes:
      - rabbit-data:/var/lib/rabbitmq

  postgres:
    image: postgres:17
    container_name: trade-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "Str0ng!Passw0rd"
      POSTGRES_DB: trading
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
    volumes:
      - pg-data:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: trade-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ── A fake broker ─────────────────────────────────────────────────────────
  # Configure these three behaviours — they are the "now break it" list:
  #
  #   1. Normal    ack in ~50ms, then a fill
  #   2. Slow      ack in 5s (does the order go to Unknown?)
  #   3. Timeout   no response at all (the important one — never auto-retry)
  broker-mock:
    image: wiremock/wiremock:latest
    container_name: trade-broker-mock
    ports:
      - "8089:8080"
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./mocks/broker:/home/wiremock

volumes:
  kafka-data:
  rabbit-data:
  pg-data:
