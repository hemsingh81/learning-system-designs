# Market data case study — infrastructure only.
#
#   docker compose up -d
#
#   Kafka            localhost:9092
#   Kafka UI         http://localhost:8080     ← watch consumer lag PER PARTITION here
#   TimescaleDB      localhost:5432            (postgres / Str0ng!Passw0rd)
#   Grafana          http://localhost:3000     (admin / admin)
#   Prometheus       http://localhost:9090
#
# Create the topics before starting your services (partition counts matter —
# see "Partitioning" in the README):
#
#   docker exec md-kafka /opt/kafka/bin/kafka-topics.sh --create \
#     --bootstrap-server localhost:9092 --topic market.ticks.raw \
#     --partitions 64 --replication-factor 1 --config retention.ms=86400000
#
#   docker exec md-kafka /opt/kafka/bin/kafka-topics.sh --create \
#     --bootstrap-server localhost:9092 --topic market.ticks.clean \
#     --partitions 64 --replication-factor 1 --config retention.ms=604800000
#
#   docker exec md-kafka /opt/kafka/bin/kafka-topics.sh --create \
#     --bootstrap-server localhost:9092 --topic market.candles \
#     --partitions 16 --replication-factor 1 --config retention.ms=7776000000
#
#   docker exec md-kafka /opt/kafka/bin/kafka-topics.sh --create \
#     --bootstrap-server localhost:9092 --topic market.gaps \
#     --partitions 4 --replication-factor 1

services:

  kafka:
    image: apache/kafka:latest
    container_name: md-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Tuned for throughput, which is the whole constraint of this case study.
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 16
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576

      # Default retention 24h. Per-topic overrides are set at creation (above) —
      # each topic has a different retention BUDGET, and that is deliberate.
      KAFKA_LOG_RETENTION_HOURS: 24

      # Compression at the broker as well as the producer. Market data repeats
      # heavily and compresses roughly 20:1.
      KAFKA_COMPRESSION_TYPE: lz4

      # Auto-creation OFF. A topic created implicitly gets the DEFAULT partition
      # count (usually 1), which silently caps you at one consumer — and you find
      # out when lag grows and adding instances changes nothing.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: md-kafka-ui
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ── The archive ───────────────────────────────────────────────────────────
  # TimescaleDB: PostgreSQL with time-series partitioning and compression.
  # 1.2 billion rows a day is not a normal PostgreSQL workload without it.
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: md-timescale
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "Str0ng!Passw0rd"
      POSTGRES_DB: marketdata
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "max_wal_size=8GB"          # big batched writes generate a lot of WAL
      - "-c"
      - "checkpoint_timeout=30min"  # fewer, larger checkpoints suit bulk loading
    volumes:
      - ts-data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d

  # ── Metrics ───────────────────────────────────────────────────────────────
  # CONSUMER LAG PER PARTITION is the metric that matters here. Not CPU.
  # Lag tells you that you are falling behind about 20 minutes before a human
  # notices a stale chart.
  prometheus:
    image: prom/prometheus:latest
    container_name: md-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: md-grafana
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards

  # Exports Kafka consumer-group lag to Prometheus. Without this, "are we keeping
  # up?" is a question you can only answer by clicking around a UI.
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: md-kafka-exporter
    depends_on: [kafka]
    ports:
      - "9308:9308"
    command: ["--kafka.server=kafka:9092"]

volumes:
  kafka-data:
  ts-data:
  grafana-data:
